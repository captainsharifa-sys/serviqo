{% extends "base.html" %}

{% block title %}
Edit Working Hours
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2 class="mb-4">
            ✏ Edit Working Hours
        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                class="btn btn-primary"
                type="submit">

                Save Changes

            </button>

            <a
                href="{% url 'working_hours' %}"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
