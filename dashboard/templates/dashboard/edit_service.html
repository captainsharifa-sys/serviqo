{% extends "base.html" %}

{% block title %}
Edit Service
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2 class="mb-4">
            ✏ Edit Service
        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary">

                Save Changes

            </button>

            <a
                href="{% url 'services' %}"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
