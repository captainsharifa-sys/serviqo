{% extends "base.html" %}

{% block title %}
Edit Appointment
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="fw-bold mb-4">
                    ✏️ Edit Appointment
                </h2>

                <p class="text-muted">
                    Update the appointment for
                    <strong>{{ appointment.customer_name }}</strong>.
                </p>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            💾 Save Changes
                        </button>

                        <a
                            href="{% url 'appointments' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
